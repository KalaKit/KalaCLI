[project]
name="kalacli"
version="1-1-0"
kmake="project.kmake"

[references]
dir_kh="../kalaheaders"
ext_kh="external/kalaheaders"

[windows-sync]
kh_license=[ "${dir_kh}/LICENSE.md", "${ext_kh}/LICENSE.md", "copy" ]
kh_readme=[ "${dir_kh}/README.md", "${ext_kh}/README.md", "copy" ]
kh_include=[ "${dir_kh}/include", "${ext_kh}/include", "copy" ]

[windows-post-build-sync]
kc_bin_rel=[ "build/temp/release-windows/kalacli.lib", "build/${version}/kalacli.lib", "copy" ]
kc_bin_deb=[ "build/temp/debug-windows/kalaclid.lib", "build/${version}/kalaclid.lib", "copy" ]
kc_include=[ "include", "build/${version}/include", "copy" ]
kc_license=[ "LICENSE.md", "build/${version}/LICENSE.md", "copy" ]
kc_readme=[ "README.md", "build/${version}/README.md", "copy" ]
kc_changes=[ "CHANGES.md", "build/${version}/CHANGES.md", "copy" ]
kh_stuff=[ "${ext_kh}", "build/${version}/kalaheaders", "copy" ]

[windows-gnu-sync]
kh_license=[ "${dir_kh}/LICENSE.md", "${ext_kh}/LICENSE.md", "copy" ]
kh_readme=[ "${dir_kh}/README.md", "${ext_kh}/README.md", "copy" ]
kh_include=[ "${dir_kh}/include", "${ext_kh}/include", "copy" ]

[windows-gnu-post-build-sync]
kc_bin_rel=[ "build/temp/release-windows-gnu/kalacli-gnu.lib", "build/${version}/kalacli-gnu.lib", "copy" ]
kc_bin_deb=[ "build/temp/debug-windows-gnu/kalacli-gnud.lib", "build/${version}/kalacli-gnud.lib", "copy" ]
kc_include=[ "include", "build/${version}/include", "copy" ]
kc_license=[ "LICENSE.md", "build/${version}/LICENSE.md", "copy" ]
kc_readme=[ "README.md", "build/${version}/README.md", "copy" ]
kc_changes=[ "CHANGES.md", "build/${version}/CHANGES.md", "copy" ]
kh_stuff=[ "${ext_kh}", "build/${version}/kalaheaders", "copy" ]

[linux-sync]
kh_license=[ "${dir_kh}/LICENSE.md", "${ext_kh}/LICENSE.md", "copy" ]
kh_readme=[ "${dir_kh}/README.md", "${ext_kh}/README.md", "copy" ]
kh_include=[ "${dir_kh}/include", "${ext_kh}/include", "copy" ]

[linux-post-build-sync]
kc_bin_rel=[ "build/temp/release-linux/libkalacli.a", "build/${version}/libkalacli.a", "copy" ]
kc_bin_deb=[ "build/temp/debug-linux/libkalaclid.a", "build/${version}/libkalaclid.a", "copy" ]
kc_include=[ "include", "build/${version}/include", "copy" ]
kc_license=[ "LICENSE.md", "build/${version}/LICENSE.md", "copy" ]
kc_readme=[ "README.md", "build/${version}/README.md", "copy" ]
kc_changes=[ "CHANGES.md", "build/${version}/CHANGES.md", "copy" ]
kh_stuff=[ "${ext_kh}", "build/${version}/kalaheaders", "copy" ]
